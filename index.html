.sp-ko{margin-top:22px;font-size:19px;color:#9aa7b8;display:flex;gap:7px;align-items:baseline}
.sp-ko .a{animation:spIn .5s .9s both}.sp-ko .a s{text-decoration:none;position:relative}.sp-ko .a s::after{content:"";position:absolute;left:-2px;right:-2px;top:55%;height:2px;background:#f04452;transform:scaleX(0);transform-origin:left;animation:spLine .35s 1.3s ease-out forwards}
.sp-ko .b{color:#fff;font-weight:800;font-size:21px;position:relative;animation:spPop .55s 1.6s cubic-bezier(.2,.8,.2,1) both}.sp-ko .b::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:2px;background:#4a9eff;transform:scaleX(0);transform-origin:left;animation:spLine .45s 1.95s ease-out forwards}

@keyframes spPop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes spLine{to{transform:scaleX(1)}}
